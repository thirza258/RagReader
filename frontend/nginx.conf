map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 5176;
    server_name localhost;
    client_max_body_size 100M;

    # Docker's embedded DNS. Without this, nginx resolves the `backend` hostname
    # once at startup and caches the IP forever; when the backend container is
    # recreated with a new address, every /api/ and /ws/ request 502s until nginx
    # itself is restarted. The variable forces a re-resolve every `valid` seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /index.md {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header x-markdown-tokens "580" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
    }

    # RFC 9727 API Catalog
    location = /.well-known/api-catalog {
        default_type "application/linkset+json; charset=utf-8";
        add_header Content-Type "application/linkset+json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Auth.md discovery
    location = /auth.md {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # RFC 9728 OAuth Protected Resource Metadata
    location = /.well-known/oauth-protected-resource {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # OAuth / OIDC Discovery & Bot Auth
    location ~* ^/\.well-known/(openid-configuration|oauth-authorization-server|agent-card\.json|jwks\.json|http-message-signatures-directory)$ {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Agent Skills Discovery
    location = /.well-known/agent-skills/index.json {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SEP-1649 MCP Server Cards
    location ~* ^/\.well-known/mcp/.*\.json$ {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/mcp.json {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Skill markdown artifacts
    location /skills/ {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # OpenAPI schema & docs proxies
    location = /api/openapi.json {
        proxy_pass http://backend:8000/api/schema/?format=json;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /api/docs {
        proxy_pass http://backend:8000/api/docs/;
        proxy_set_header Host $host;
    }

    location / {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
        add_header Vary "Accept" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
        add_header Vary "Accept" always;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /ws/ {
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        text/markdown
        application/linkset+json
        image/svg+xml;

    # Service-worker files must be revalidated on every request. The generic
    # static-file rule below would otherwise serve them "immutable" for a
    # year, pinning browsers to a stale worker after every deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~* ^/(registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
