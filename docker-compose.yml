services:
  backend:
    build:
      context: ${BACKEND_CONTEXT:-./backend}
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
    container_name: ${BACKEND_CONTAINER_NAME:-ragreader_backend}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: ${BACKEND_COMMAND:-daphne -b 0.0.0.0 -p 8000 ragreader.asgi:application}
    ports:
      - "${BACKEND_PORT:-8050}:8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Ollama runs on the host; the reranker (HybridRAG) reads this env var.
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media:/app/media
      - vectorstores:/app/vector_stores

  worker:
    build:
      context: ${BACKEND_CONTEXT:-./backend}
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
    container_name: ${WORKER_CONTAINER_NAME:-ragreader_worker}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: ${WORKER_COMMAND:-celery -A ragreader worker -l info}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # The worker also runs the RAG engines (init job), so it needs Ollama too.
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media:/app/media
      - vectorstores:/app/vector_stores

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-./frontend}
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
    container_name: ${FRONTEND_CONTAINER_NAME:-ragreader_frontend}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${FRONTEND_PORT:-5150}:5176"
    env_file:
      - ./frontend/.env

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-ragreader_redis}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${REDIS_PORT:-6350}:6379"

  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-ragreader_postgres}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ${POSTGRES_DATA_PATH:-./postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  media:
  vectorstores: