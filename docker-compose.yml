services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragreader_backend
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 ragreader.asgi:application
    ports:
      - "8050:8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - media:/app/media
      - vectorstores:/app/vector_stores

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragreader_worker
    restart: unless-stopped
    command: celery -A ragreader worker -l info
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - media:/app/media
      - vectorstores:/app/vector_stores

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ragreader_frontend
    restart: unless-stopped
    ports:
      - "5150:5176"
    env_file:
      - ./frontend/.env

  redis:
    image: redis:7-alpine
    container_name: ragreader_redis
    restart: unless-stopped
    ports:
      - "6350:6379"

  postgres:
    image: postgres:16-alpine
    container_name: ragreader_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: changeme
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  media:
  vectorstores: